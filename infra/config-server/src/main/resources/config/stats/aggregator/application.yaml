spring:
  application:
    name: aggregator

aggregator:
  kafka:
    producer:
      properties:
        bootstrap-servers: localhost:9092
        key-serializer-class: org.apache.kafka.common.serialization.LongSerializer
        value-serializer-class: ru.practicum.avro.serializer.SerializerAvro
      topic:
        events-similarity: stats.events-similarity.v1
    consumer:
      properties:
        bootstrap-servers: localhost:9092
        key-deserializer-class: org.apache.kafka.common.serialization.LongDeserializer
        value-deserializer-class: ru.practicum.avro.deserializer.UserActionDeserializer
        group-id: UserActionGroup
        client-id: UserActionClient
        enable-auto-commit: false
        poll-timeout: 1000
      topic:
        user-action: stats.user-actions.v1

  weights:
    view: 0.4
    register: 0.8
    like: 1.0


logging:
  level:
    ru.practicum: INFO
    org.springframework.kafka: INFO